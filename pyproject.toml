[project]
name = "arctic-rts-scaffold"
version = "0.1.0"
description = "Scaffold for retrogressive thaw slump instance segmentation on satellite imagery"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy",
  "scipy",
  "torch>=2.2",
  "pycocotools",
]

[dependency-groups]
dev = ["pytest"]

[project.scripts]
rts = "rts.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
